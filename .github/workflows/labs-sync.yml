name: Sync Official Plezy Release

on:
  workflow_dispatch:
    inputs:
      official_tag:
        description: Published official Plezy tag to merge
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: plezy-labs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: labs
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
          pub-cache: false

      - name: Fetch and validate the published tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ inputs.official_tag }}'
          RELEASE=$(gh api "repos/edde746/plezy/releases/tags/$TAG")
          test "$(jq -r '.draft' <<<"$RELEASE")" = false
          test "$(jq -r '.prerelease' <<<"$RELEASE")" = false
          git fetch --no-tags https://github.com/edde746/plezy.git "refs/tags/$TAG:refs/tags/$TAG"
          TAG_VERSION=${TAG#v}
          SOURCE_VERSION=$(git show "$TAG:pubspec.yaml" | sed -n 's/^version: \([^+]*\).*/\1/p')
          test "$TAG_VERSION" = "$SOURCE_VERSION" || {
            echo "Published tag $TAG does not match pubspec version $SOURCE_VERSION" >&2
            exit 1
          }

      - name: Check Labs preference compatibility
        id: preferences
        continue-on-error: true
        run: scripts/check-labs-preferences.sh '${{ inputs.official_tag }}'

      - name: Report preference incompatibility
        if: steps.preferences.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Plezy Labs preference migration required for ${{ inputs.official_tag }}" \
            --body "The automatic Labs sync stopped because official Plezy now collides with a Labs-owned preference. Add and test an explicit compatibility migration, then run the sync manually. No merge or release was published."

      - name: Merge the exact official tag
        if: steps.preferences.outcome == 'success'
        id: merge
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-ff --no-commit '${{ inputs.official_tag }}'
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            if ! scripts/resolve-labs-generated-conflicts.sh; then
              conflicts=$(git diff --name-only --diff-filter=U | paste -sd, -)
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "files=$conflicts" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! git rev-parse --verify -q MERGE_HEAD >/dev/null; then
            echo "Official tag is already present on labs; nothing to publish."
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          flutter pub get --enforce-lockfile --no-example
          scripts/prepare-labs-translations.py
          dart run slang
          git add -- lib/i18n/strings*.g.dart

          conflicts=$(git diff --name-only --diff-filter=U | paste -sd, -)
          if [ -n "$conflicts" ]; then
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "files=$conflicts" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(labs): sync official Plezy ${{ inputs.official_tag }}"
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Plezy Labs sync conflict for ${{ inputs.official_tag }}" \
            --body "The exact published tag could not be merged automatically. Conflicting files: ${{ steps.merge.outputs.files }}. No branch update or release was published."

      - name: Run repository checks
        if: steps.preferences.outcome == 'success' && steps.merge.outputs.conflict == 'false' && steps.merge.outputs.changed == 'true'
        id: checks
        continue-on-error: true
        run: |
          (cd packages/saf_util && flutter pub get)
          scripts/prepare-labs-translations.py --check
          python3 scripts/test_prepare_labs_translations.py
          scripts/check-labs-workflows.py
          scripts/ci_checks.sh

      - name: Report failed checks
        if: steps.checks.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Plezy Labs checks failed for ${{ inputs.official_tag }}" \
            --body "The published tag merged locally, but repository checks failed. The Labs branch and release were left unchanged. Inspect workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."

      - name: Keep upstream publishing workflows disabled on the fork
        if: steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow disable release.yml --repo "${{ github.repository }}"
          gh workflow disable update-packages.yml --repo "${{ github.repository }}"

      - name: Push the verified sync
        if: steps.checks.outcome == 'success'
        run: git push origin HEAD:labs

      - name: Automatically publish Labs revision 1
        if: steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run labs-release.yml \
            --repo "${{ github.repository }}" \
            --ref labs \
            -f publish=true
